<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BM Year 1 Reading App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fdf6e3, #e3f2fd);
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .app {
      max-width: 600px;
      margin: auto;
      background: white;
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    h1 {
      color: #1565c0;
      font-size: 28px;
    }

    .word-box {
      font-size: 55px;
      font-weight: bold;
      color: #2e7d32;
      background: #f1f8e9;
      padding: 25px;
      border-radius: 20px;
      margin: 20px 0;
    }

    button {
      font-size: 18px;
      padding: 14px 22px;
      border: none;
      border-radius: 15px;
      margin: 8px;
      cursor: pointer;
      background: #1976d2;
      color: white;
    }

    button:hover {
      background: #0d47a1;
    }

    input {
      font-size: 22px;
      padding: 12px;
      border-radius: 12px;
      border: 2px solid #90caf9;
      width: 80%;
      text-align: center;
      margin-top: 10px;
    }

    .result {
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
      min-height: 40px;
    }

    .small {
      font-size: 14px;
      color: #555;
    }

    .score {
      background: #fff3e0;
      padding: 12px;
      border-radius: 15px;
      margin-top: 18px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>📘 BM Year 1 Reading App</h1>
    <p>Read the word. Then click the microphone and say the word.</p>

    <div class="word-box" id="targetWord">baju</div>

    <button onclick="startListening()">🎤 Say the Word</button>
    <button onclick="nextWord()">➡️ Next Word</button>

    <div class="result" id="voiceResult">Voice result will appear here.</div>

    <hr />

    <h2>✏️ Typing Practice</h2>
    <p>Type the same word:</p>
    <input id="typedAnswer" placeholder="Type here" />
    <br />
    <button onclick="checkTyping()">Check Typing</button>

    <div class="result" id="typingResult"></div>

    <div class="score">
      ✅ Score: <span id="score">0</span> / <span id="total">0</span>
    </div>

    <p class="small">
      Note: Voice recognition works best in Google Chrome. Speak clearly in a quiet place.
    </p>
  </div>

  <script>
    const words = [
      "baju",
      "buku",
      "bola",
      "meja",
      "nasi",
      "susu",
      "mata",
      "kaki",
      "roti",
      "ikan"
    ];

    let currentIndex = 0;
    let score = 0;
    let total = 0;

    function cleanText(text) {
      return text
        .toLowerCase()
        .replace(/[.,!?]/g, "")
        .trim();
    }

    function updateWord() {
      document.getElementById("targetWord").textContent = words[currentIndex];
      document.getElementById("voiceResult").textContent = "Voice result will appear here.";
      document.getElementById("typingResult").textContent = "";
      document.getElementById("typedAnswer").value = "";
    }

    function nextWord() {
      currentIndex = (currentIndex + 1) % words.length;
      updateWord();
    }

    function addScore(correct) {
      total++;
      if (correct) score++;
      document.getElementById("score").textContent = score;
      document.getElementById("total").textContent = total;
    }

    function startListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        document.getElementById("voiceResult").textContent = "❌ Sorry, this browser does not support voice recognition. Please use Google Chrome.";
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "ms-MY";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      document.getElementById("voiceResult").textContent = "🎧 Listening... please say the word.";

      recognition.start();

      recognition.onresult = function(event) {
        const spokenText = cleanText(event.results[0][0].transcript);
        const target = cleanText(words[currentIndex]);

        if (spokenText === target) {
          document.getElementById("voiceResult").textContent = "✅ Correct! I heard: " + spokenText;
          addScore(true);
        } else {
          document.getElementById("voiceResult").textContent = "❌ Try again. I heard: " + spokenText;
          addScore(false);
        }
      };

      recognition.onerror = function(event) {
        document.getElementById("voiceResult").textContent = "❌ Voice error: " + event.error + ". Please try again.";
      };
    }

    function checkTyping() {
      const typed = cleanText(document.getElementById("typedAnswer").value);
      const target = cleanText(words[currentIndex]);

      if (typed === target) {
        document.getElementById("typingResult").textContent = "✅ Correct spelling!";
        addScore(true);
      } else {
        document.getElementById("typingResult").textContent = "❌ Try again. Correct word is: " + target;
        addScore(false);
      }
    }
  </script>
</body>
</html>
